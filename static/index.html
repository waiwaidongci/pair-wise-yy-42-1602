<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山火事件指挥与离线人员调度</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin:.2rem}</style></head><body><h1>山火事件指挥与离线人员调度</h1><p>维护火线、风向、资源和任务区，合并离线现场记录并防止人员重复分配。</p><p>派单按半开时段检测重叠并指出冲突任务区；离线批次按最早现场时间合并，矛盾状态待调度员确认；任务区关闭前未撤离资源和未确认记录都会被拦截。</p><button onclick="loadZones()">刷新任务区</button> <button onclick="loadPending()">待确认离线记录</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>
async function get(path){const r=await fetch(path,{headers:{'X-Actor':'demo','X-Role':'viewer'}});return r.json()}
async function loadZones(){document.getElementById('out').textContent=JSON.stringify(await get('/api/zones'),null,2)}
async function loadPending(){document.getElementById('out').textContent=JSON.stringify(await get('/api/offline-reports?status=pending'),null,2)}
</script></body></html>
